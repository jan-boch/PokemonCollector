name: Keep free-tier services alive

# Supabase free tier pauses projects after ~7 days without API activity.
# This workflow makes a real database query every 3 days so both the
# Pokemon tracker DB and the blog DB stay active.

on:
  schedule:
    # Every 3rd day at 08:00 UTC (well under Supabase's 7-day pause window)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Pokemon tracker Supabase (real DB query)
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/cards?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "Pokemon tracker Supabase: HTTP $code"
          test "$code" = "200"

      - name: Ping blog Supabase (skipped if secrets not set)
        env:
          URL: ${{ secrets.BLOG_SUPABASE_URL }}
          KEY: ${{ secrets.BLOG_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ]; then
            echo "BLOG_SUPABASE_URL not set, skipping"
            exit 0
          fi
          # Root /rest/v1/ requires a secret key on new-API-key projects,
          # so query a real table instead (also guarantees DB activity).
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/blog_posts?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "Blog Supabase: HTTP $code"
          test "$code" = "200"

      - name: Wake up blog on Render (skipped if secret not set)
        env:
          URL: ${{ secrets.BLOG_RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "BLOG_RENDER_URL not set, skipping"
            exit 0
          fi
          # Render cold start can take ~1 minute, so allow a long timeout
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL")
          echo "Blog on Render: HTTP $code"
          test "$code" = "200"
